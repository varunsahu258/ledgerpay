<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LedgerPay concurrency invariant results" />
    <title>LedgerPay Invariant Results</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172b4d; }
      body { max-width: 900px; margin: 0 auto; padding: 24px; }
      nav { margin: -24px -24px 30px; padding: 14px 24px; background: #102a43; }
      nav a { color: white; margin-right: 20px; text-decoration: none; }
      h1 { margin-bottom: 4px; }
      .muted { color: #52677f; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 24px 0; }
      .card { border: 1px solid #d5deea; border-radius: 10px; padding: 16px; }
      .value { display: block; font-size: 1.8rem; font-weight: 700; }
      .label { color: #52677f; }
      .chart { border: 1px solid #d5deea; border-radius: 10px; padding: 16px; }
      canvas { display: block; width: 100%; height: 230px; }
      #status { padding: 12px; background: #eef3f8; border-radius: 8px; }
      @media (max-width: 500px) { body { padding: 16px; } nav { margin: -16px -16px 24px; } }
    </style>
  </head>
  <body>
    <nav><a href="./">Console</a><a href="./api.html">API Reference</a><a href="./results.html">Concurrency Results</a></nav>
    <h1>Concurrency invariants</h1>
    <p class="muted">Latest deterministic 200-request workload from the test suite.</p>
    <p id="status" role="status">Loading test results…</p>
    <section class="cards" aria-label="Run counts">
      <div class="card"><span class="value" id="attempted">—</span><span class="label">Transfers attempted</span></div>
      <div class="card"><span class="value" id="succeeded">—</span><span class="label">Succeeded</span></div>
      <div class="card"><span class="value" id="rejected">—</span><span class="label">Rejected</span></div>
      <div class="card"><span class="value" id="violations">—</span><span class="label">Invariant violations</span></div>
    </section>
    <section class="chart" aria-label="Transfer outcomes chart">
      <h2>Run outcomes</h2>
      <canvas id="chart" role="img" aria-label="Bar chart of attempted, succeeded, rejected, and invariant violations"></canvas>
    </section>
    <script>
      const ids = ["attempted", "succeeded", "rejected", "violations"];
      function drawChart(values) {
        const canvas = document.getElementById("chart");
        const scale = window.devicePixelRatio || 1;
        const width = canvas.clientWidth;
        const height = 230;
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        const labels = ["Attempted", "Succeeded", "Rejected", "Violations"];
        const colors = ["#3b82f6", "#16a34a", "#f59e0b", "#dc2626"];
        const maxValue = Math.max(1, ...values);
        const slot = width / values.length;
        values.forEach((value, index) => {
          const barHeight = (value / maxValue) * 150;
          const x = index * slot + slot * 0.2;
          const y = 172 - barHeight;
          ctx.fillStyle = colors[index];
          ctx.fillRect(x, y, slot * 0.6, barHeight);
          ctx.fillStyle = "#172b4d";
          ctx.textAlign = "center";
          ctx.font = "13px system-ui, sans-serif";
          ctx.fillText(String(value), x + slot * 0.3, Math.max(16, y - 6));
          ctx.fillText(labels[index], x + slot * 0.3, 198);
        });
      }
      fetch("./invariants.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((report) => {
          const keys = ["transfers_attempted", "succeeded", "rejected", "invariant_violations"];
          const values = keys.map((key) => Number.isFinite(report[key]) ? report[key] : null);
          ids.forEach((id, index) => {
            document.getElementById(id).textContent = values[index] === null ? "—" : String(values[index]);
          });
          const status = document.getElementById("status");
          status.textContent = report.run_status === "passed" && values[3] === 0
            ? "Run passed: all checked invariants held."
            : `Run status: ${report.run_status || "unknown"}. Unmeasured values are shown as dashes.`;
          drawChart(values.map((value) => value ?? 0));
        })
        .catch((error) => {
          document.getElementById("status").textContent = `Could not load the invariant report: ${error.message}`;
        });
      window.addEventListener("resize", () => {
        fetch("./invariants.json").then((response) => response.json()).then((report) => {
          drawChart([report.transfers_attempted, report.succeeded, report.rejected, report.invariant_violations].map((value) => Number(value) || 0));
        });
      });
    </script>
  </body>
</html>
