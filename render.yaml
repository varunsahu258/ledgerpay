services:
  - type: web
    name: ledgerpay
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      /bin/sh -c 'uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000} --proxy-headers'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RATE_LIMIT_REQUESTS
        value: "60"
      - key: DEMO_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: DEMO_MAX_ACCOUNTS
        value: "100"
      - key: DEMO_SEED_TOKEN
        sync: false
      - key: DEMO_RESET_ENABLED
        value: "false"
