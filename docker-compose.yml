services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerpay
      POSTGRES_PASSWORD: ledgerpay
      POSTGRES_DB: ledgerpay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpay -d ledgerpay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ledgerpay:ledgerpay@db:5432/ledgerpay
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
